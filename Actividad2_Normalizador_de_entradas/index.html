<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Actividad 2. Normalizador de entradas</title>
  <script type="module" src="./app.js"></script>
  <link rel="icon" href="data:,">
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 400px;
      margin: 2rem auto;
    }

    label {
      display: block;
      margin-bottom: 1rem;
    }

    input, select {
      display: block;
      width: 100%;
      padding: 0.4rem;
      margin-top: 0.3rem;
    }

    pre {
      background: #eee;
      padding: 1rem;
    }
  </style>
</head>
<body>
  <h1>Normalizador de entradas</h1>

  <form id="formulario">
    <label>Nombre
      <input type="text" id="nombre">
    </label>

    <label>Edad
      <input type="text" id="edad">
    </label>

    <label>Acepta normas
      <select id="acepta">
        <option value="true">true (booleano)</option>
        <option value="false">false (booleano)</option>
        <option value="texto-false">"false" (texto)</option>
      </select>
    </label>

    <button type="submit">Normalizar</button>
  </form>

  <h2>Resultado</h2>
  <pre id="salida"></pre>

</body>
</html>
